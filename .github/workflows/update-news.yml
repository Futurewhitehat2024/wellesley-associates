name: Update market headlines

on:
  schedule:
    # Daily, about 13:20 UTC, after the rates job. GitHub may start the run a few minutes later.
    - cron: "20 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download RSS feeds
        run: node scripts/update-news.mjs

      - name: Commit headlines if they changed
        run: |
          git add data/news.json
          if git diff --cached --quiet; then
            echo "No headline changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update published market headlines."
          git push
