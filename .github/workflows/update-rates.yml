name: Update market rates

on:
  schedule:
    # GitHub drops top-of-hour crons under load. 11:17 UTC is the daily pull.
    # 21:47 UTC is the same-day backup when the morning run is skipped.
    - cron: "17 11 * * *"
    - cron: "47 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update-rates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download FRED and Treasury series
        run: node scripts/update-rates.mjs

      - name: Commit rates if they changed
        run: |
          git add data/rates.json
          if git diff --cached --quiet; then
            echo "No rate changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update published market rates."
          git push
