name: Update market rates

on:
  schedule:
    # Daily, about 11:00 UTC. GitHub may start the run a few minutes later.
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: false

jobs:
  update-rates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download FRED series
        run: node scripts/update-rates.mjs

      - name: Commit rates if they changed
        run: |
          git add data/rates.json
          if git diff --cached --quiet; then
            echo "No rate changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update published FRED rates."
          git push
